name: Julia CI (Build & Test)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Logic & Bug Check (JET.jl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Install dependencies
        working-directory: ./OpticalWavePropSim
        run: julia --project=@. -e 'using Pkg; Pkg.instantiate(); Pkg.add("JET")'
      - name: Run JET
        working-directory: ./OpticalWavePropSim
        run: julia --project=@. -e 'using JET; report_package("OpticalWavePropSim")'

  lint:
    name: Formatting Suggestions
    runs-on: ubuntu-latest
    continue-on-error: true # Keep the badge green even if style is "MATLAB-esque"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/julia-format@v3
        with:
          verify: true

  build-and-test:
    name: Physics Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2

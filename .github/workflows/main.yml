name: Julia CI (Build & Test)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 1. This suppresses the deprecation warnings and opts into the Node 24 runtime early
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Install dependencies (Instantiate)
        run: |
          julia --project=@. -e 'using Pkg; Pkg.instantiate()'

      - name: Run Master Simulation Smoke Test
        env:
          GKSwstype: "100" # Headless plotting mode
        run: |
          julia --project=@. -e '
            include("examples/Chapter9/example_pt_source_atmos_setup.jl");
            include("examples/Chapter9/analysis_pt_source_atmos_samp.jl");
            include("examples/Chapter9/example_pt_source_vac_prop.jl");
            include("examples/Chapter9/example_pt_source_turb_prop.jl");
          '
